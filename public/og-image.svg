<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#B8651A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="1200" y2="530" stroke="#fff" stroke-width="1"/>
    <line x1="800" y1="0" x2="1200" y2="260" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="400" y2="630" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Branching path icon (centered above title) -->
  <g transform="translate(600, 195)" opacity="0.9">
    <!-- Main trunk -->
    <line x1="0" y1="30" x2="0" y2="-10" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
    <!-- Left branch -->
    <path d="M0,-10 C0,-25 -25,-35 -35,-50" stroke="#8B4513" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Right branch -->
    <path d="M0,-10 C0,-25 25,-35 35,-50" stroke="#8B4513" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Sub-branches left -->
    <path d="M-35,-50 C-35,-60 -50,-65 -55,-75" stroke="#8B4513" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M-35,-50 C-35,-60 -20,-65 -18,-75" stroke="#8B4513" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Sub-branches right -->
    <path d="M35,-50 C35,-60 50,-65 55,-75" stroke="#8B4513" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M35,-50 C35,-60 20,-65 18,-75" stroke="#8B4513" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Dots at branch ends -->
    <circle cx="-55" cy="-75" r="3" fill="#8B4513" opacity="0.7"/>
    <circle cx="-18" cy="-75" r="3" fill="#8B4513" opacity="0.7"/>
    <circle cx="18" cy="-75" r="3" fill="#8B4513" opacity="0.7"/>
    <circle cx="55" cy="-75" r="3" fill="#8B4513" opacity="0.7"/>
    <!-- Root dot -->
    <circle cx="0" cy="30" r="4" fill="#8B4513"/>
  </g>

  <!-- Main title -->
  <text x="600" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="bold" fill="#f0e6d3" letter-spacing="6">Arcwrite</text>

  <!-- Accent line under title -->
  <rect x="450" y="335" width="300" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.8"/>

  <!-- Subtitle -->
  <text x="600" y="385" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#a0a0b8" letter-spacing="4">AI-Powered Interactive Fiction</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)" opacity="0.6"/>
</svg>